name: Build iOS

on:
  # Dispatchable so a signing problem can be chased without burning a tag and
  # recreating the release each time.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag (e.g. v1.6.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Git tag (e.g. v1.6.0)'
        required: true
        type: string
    secrets:
      IOS_DIST_CERT_BASE64:
        required: true
      IOS_DIST_CERT_PASSWORD:
        required: true
      IOS_KEYCHAIN_PASSWORD:
        required: true
      IOS_PROVISIONING_PROFILE_BASE64:
        required: true
      IOS_PROVISIONING_PROFILE_NAME:
        required: true
      APPSTORE_API_KEY_ID:
        required: true
      APPSTORE_API_ISSUER_ID:
        required: true
      APPSTORE_API_PRIVATE_KEY:
        required: true

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # The asset names and CFBundleShortVersionString both come from
      # pubspec.yaml, so a tag that disagrees with it ships a build labelled
      # as a version nobody released.
      - name: Check the tag matches pubspec
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          # A platform test tag (v1.12.0-ios.22) also names the build number,
          # which has to be the one after the + - the store refuses a build
          # number it has already seen, so a stale one fails here rather than
          # at the upload.
          if [[ ! "$TAG" =~ ^v([0-9]+(\.[0-9]+)*)(-(ios|android)\.([0-9]+))?$ ]]; then
            echo "Tag $TAG is neither vX.Y.Z nor vX.Y.Z-ios.N / vX.Y.Z-android.N" >&2
            exit 1
          fi
          TAG_VERSION="${BASH_REMATCH[1]}"
          TAG_BUILD="${BASH_REMATCH[5]}"
          if [ "$TAG_VERSION" != "${VERSION%%+*}" ]; then
            echo "Tag $TAG does not match pubspec version $VERSION" >&2
            exit 1
          fi
          if [ -n "$TAG_BUILD" ] && [ "$TAG_BUILD" != "${VERSION#*+}" ]; then
            echo "Tag $TAG names build $TAG_BUILD, pubspec has $VERSION" >&2
            exit 1
          fi

      # 16.3 was pinned because 16.4 broke signing (flutter/flutter#174581), but
      # this image's 16.3 has no usable iOS device platform: xcodebuild lists
      # the SDK and then refuses every `Any iOS Device` destination, which
      # Flutter reports only as "No Xcode build settings have been found".
      # 26.3 configures cleanly and is past the 16.4 signing bug.
      # The pin has to track what the runner image actually ships, so say what
      # is available rather than failing with "no such file".
      - name: Select Xcode 26.3
        run: |
          XCODE=/Applications/Xcode_26.3.app
          if [ ! -d "$XCODE" ]; then
            echo "$XCODE is not on this runner image. Available:" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'

      - name: Install Apple certificate and provisioning profile
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$IOS_DIST_CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$PP_DIR"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_DIR/profile.mobileprovision"

      - name: Configure ExportOptions.plist
        env:
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          # plistlib rather than `plutil -replace`, whose keypaths treat the
          # dots in the bundle id as separators.
          python3 - <<'PY'
          import os
          import plistlib

          path = "ios/ExportOptions.plist"
          with open(path, "rb") as f:
              plist = plistlib.load(f)
          plist["provisioningProfiles"]["dev.termphin.termphin"] = os.environ["IOS_PROVISIONING_PROFILE_NAME"]
          with open(path, "wb") as f:
              plistlib.dump(plist, f)
          PY

      # The archive is what failed before ExportOptions.plist ever got a say:
      # that file only governs the export. The Runner target defines no signing
      # of its own in Release and takes its settings from this xcconfig, which
      # in Xcode's order beats the project-level "Apple Development" identity -
      # so this is where the distribution identity has to be named.
      - name: Point the archive at manual signing
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          if [ -z "$IOS_TEAM_ID" ]; then
            echo "vars.IOS_TEAM_ID is unset; the archive cannot resolve a team" >&2
            exit 1
          fi
          {
            printf '\n'
            printf 'CODE_SIGN_STYLE = Manual\n'
            printf 'DEVELOPMENT_TEAM = %s\n' "$IOS_TEAM_ID"
            printf 'PROVISIONING_PROFILE_SPECIFIER = %s\n' "$IOS_PROVISIONING_PROFILE_NAME"
            printf 'CODE_SIGN_IDENTITY = Apple Distribution\n'
            printf 'CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution\n'
          } >> ios/Flutter/Release.xcconfig

      # Flutter hides xcodebuild's stderr, and the archive dies in about a
      # second - before any compiling - so the reason is in here, not in the
      # build output.
      - name: Build iOS IPA
        env:
          APP_STORE_ID: ${{ vars.APP_STORE_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          EXPORT_OPTIONS_PLIST: 'ios/ExportOptions.plist'
        run: |
          scripts/build_release.sh ios

      - name: Upload to TestFlight
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys" "$HOME/.private_keys"
          echo "$APPSTORE_API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          cp "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8" "$HOME/.private_keys/"

          shopt -s nullglob
          IPA_FILES=(build/ios/ipa/*.ipa)
          if [ ${#IPA_FILES[@]} -eq 0 ]; then
            echo "Error: No IPA found under build/ios/ipa" >&2
            exit 1
          fi

          # altool exits 0 on a rejected upload: the first attempt reported
          # "UPLOAD FAILED with 4 errors" and the job still went green, so the
          # release looked complete with nothing on TestFlight. Read the output
          # rather than the status.
          set -o pipefail
          xcrun altool --upload-app \
            -f "${IPA_FILES[0]}" \
            -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID" 2>&1 | tee /tmp/altool.log
          if grep -qE "UPLOAD FAILED|Failed to upload package|ERROR ITMS" /tmp/altool.log; then
            echo "altool reported a failed upload" >&2
            exit 1
          fi

      - name: Clean up secrets and temporary files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/build_cert.p12"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          rm -rf "$HOME/.appstoreconnect/private_keys" "$HOME/.private_keys"

name: macOS DMG

# A signed, notarized macOS DMG of any branch or tag, started by hand. The
# app is signed with the Developer ID Application identity (hardened
# runtime, timestamp), packed into a DMG with an Applications link on a
# drawn background (dmgbuild, macos/packaging/dmg_settings.py), notarized
# with the App Store Connect key the iOS builds upload with, and stapled.
#
# The DMG is kept as a workflow artifact. With `preview` it is also published
# as a GitHub pre-release under a `desktop-<version>-preview.<run>` tag - not a
# `v*` tag, so the store release workflow never sees it and the latest release
# stays the phones' one.
#
# Every DMG comes with a Sparkle appcast (scripts/sparkle_appcast.py) signed
# with the update key, so the installed app can find and verify it. With
# `release_tag` both go into that release - the Release workflow passes the
# `v*` tag, which makes them what `releases/latest/download/appcast.xml`, the
# app's feed, serves - and a missing release is made a pre-release. To test
# updates, build one DMG with `feed_url` pointing at a test release, then a
# second with a higher `build_number` into that release.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: true
        type: string
      preview:
        description: 'Publish the DMG as a pre-release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Put the DMG and its appcast into this release'
        required: false
        type: string
        default: ''
      build_number:
        description: 'Build number to use instead of the one in pubspec.yaml'
        required: false
        type: string
        default: ''
      feed_url:
        description: 'Appcast the app checks, instead of the latest release'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      release_tag:
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: macos-dmg-${{ inputs.release_tag || inputs.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Use the newest stable Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.50.1'

      - run: flutter pub get

      - name: Build
        env:
          WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          FEED_URL: ${{ inputs.feed_url }}
        run: |
          ARGS=(--release --dart-define=FIREBASE_WEB_API_KEY="$WEB_API_KEY")
          if [ -n "$INPUT_BUILD_NUMBER" ]; then ARGS+=(--build-number="$INPUT_BUILD_NUMBER"); fi
          if [ -n "$FEED_URL" ]; then ARGS+=(--dart-define=SPARKLE_FEED_URL="$FEED_URL"); fi
          flutter build macos "${ARGS[@]}"

      - name: Import the Developer ID identity
        env:
          P12: ${{ secrets.MACOS_DEVID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/devid.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/devid.p12"

      # The agent the app installs on Macs travels gzipped among its assets,
      # and notarization looks inside the archives: each macOS helper is
      # unpacked, signed like the app, packed again, and its digest in the
      # bundled manifest - what the app checks before installing it - is
      # replaced with the signed helper's.
      - name: Sign the bundled macOS agent
        env:
          IDENTITY: ${{ vars.MACOS_DEVID_IDENTITY }}
        run: |
          DIR=build/macos/Build/Products/Release/termphin.app/Contents/Frameworks/App.framework/Versions/A/Resources/flutter_assets/assets/termphin-agent
          MANIFEST="$DIR/manifest.properties"
          for KEY in macos_x86_64 macos_aarch64; do
            FILE=$(sed -n "s/^$KEY\.file=//p" "$MANIFEST")
            test -n "$FILE"
            HELPER="$RUNNER_TEMP/${FILE%.gz}"
            gunzip -c "$DIR/$FILE" > "$HELPER"
            codesign --force --timestamp --options runtime --sign "$IDENTITY" "$HELPER"
            gzip -9 -n -c "$HELPER" > "$DIR/$FILE"
            SHA=$(shasum -a 256 "$HELPER" | cut -d' ' -f1)
            sed -i '' "s/^$KEY\.sha256=.*/$KEY.sha256=$SHA/" "$MANIFEST"
            rm -f "$HELPER"
          done
          grep '^macos_' "$MANIFEST"

      # Inside out: every nested binary and framework first, the app last
      # with its entitlements, so no signature is sealed over an older one.
      - name: Sign the app
        env:
          IDENTITY: ${{ vars.MACOS_DEVID_IDENTITY }}
        run: |
          APP=build/macos/Build/Products/Release/termphin.app
          sign() { codesign --force --timestamp --options runtime --sign "$IDENTITY" "$@"; }
          find "$APP/Contents/Frameworks" -type f \( -name '*.dylib' -o -perm -111 \) ! -path '*/_CodeSignature/*' -print0 \
            | while IFS= read -r -d '' f; do if file "$f" | grep -q Mach-O; then sign "$f"; fi; done
          find "$APP/Contents/Frameworks" -depth \( -name '*.xpc' -o -name '*.app' \) -print0 \
            | while IFS= read -r -d '' f; do sign --preserve-metadata=entitlements "$f"; done
          find "$APP/Contents/Frameworks" -maxdepth 1 -name '*.framework' -print0 \
            | while IFS= read -r -d '' f; do sign "$f"; done
          sign --entitlements macos/Runner/Release.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Pack the DMG
        env:
          IDENTITY: ${{ vars.MACOS_DEVID_IDENTITY }}
        run: |
          mkdir -p dmg
          cp -R build/macos/Build/Products/Release/termphin.app dmg/Termphin.app
          tiffutil -cathidpicheck macos/packaging/dmg-background.png \
            macos/packaging/dmg-background@2x.png -out "$RUNNER_TEMP/background.tiff"
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s macos/packaging/dmg_settings.py \
            -D app=dmg/Termphin.app -D background="$RUNNER_TEMP/background.tiff" \
            Termphin Termphin.dmg
          codesign --force --timestamp --sign "$IDENTITY" Termphin.dmg

      - name: Notarize and staple
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit Termphin.dmg --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" \
            --issuer "$ISSUER" --wait --output-format json | tee notary.json
          if ! grep -q '"status" *: *"Accepted"' notary.json; then
            ID=$(python3 -c 'import json; print(json.load(open("notary.json"))["id"])')
            xcrun notarytool log "$ID" --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER"
            rm -f "$RUNNER_TEMP/notary.p8"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple Termphin.dmg
          spctl -a -t open --context context:primary-signature -v Termphin.dmg

      - name: Write the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          BUILD=${INPUT_BUILD_NUMBER:-$(sed -n 's/^version: *[0-9.]*+\([0-9]*\).*/\1/p' pubspec.yaml)}
          TAG=${RELEASE_TAG:-desktop-$VERSION-preview.$GITHUB_RUN_NUMBER}
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/venv/bin/python" scripts/sparkle_appcast.py --dmg Termphin.dmg \
            --version "$VERSION" --build "$BUILD" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Termphin.dmg" \
            --out appcast.xml
          cat appcast.xml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Termphin-macos-dmg
          path: |
            Termphin.dmg
            appcast.xml
          retention-days: 14

      - name: Put it into the release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Termphin.dmg appcast.xml --clobber
          else
            gh release create "$TAG" Termphin.dmg appcast.xml --target "$(git rev-parse HEAD)" \
              --prerelease --latest=false --title "Termphin for Mac $TAG" \
              --notes "A test build of the desktop app for macOS, signed and notarized. Not a release."
          fi

      - name: Publish a pre-release
        if: ${{ inputs.preview && inputs.release_tag == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          TAG="desktop-$VERSION-preview.$GITHUB_RUN_NUMBER"
          gh release create "$TAG" Termphin.dmg appcast.xml --target "$(git rev-parse HEAD)" --prerelease --latest=false \
            --title "Termphin for Mac $VERSION preview $GITHUB_RUN_NUMBER" \
            --notes "A test build of the desktop app for macOS from \`$REF\`, signed and notarized. Not a release."

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

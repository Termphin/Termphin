name: macOS DMG

# A signed, notarized macOS DMG of any branch or tag, started by hand. The
# app is signed with the Developer ID Application identity (hardened
# runtime, timestamp), packed into a DMG with an Applications link, notarized
# with the App Store Connect key the iOS builds upload with, and stapled.
#
# The DMG is kept as a workflow artifact. With `preview` it is also published
# as a GitHub pre-release under a `desktop-<version>-preview.<run>` tag - not a
# `v*` tag, so the store release workflow never sees it and the latest release
# stays the phones' one.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: true
        type: string
      preview:
        description: 'Publish the DMG as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: macos-dmg
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Use the newest stable Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.50.0'

      - run: flutter pub get

      - run: flutter build macos --release

      - name: Import the Developer ID identity
        env:
          P12: ${{ secrets.MACOS_DEVID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/devid.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/devid.p12"

      # Inside out: every nested binary and framework first, the app last
      # with its entitlements, so no signature is sealed over an older one.
      - name: Sign the app
        env:
          IDENTITY: ${{ vars.MACOS_DEVID_IDENTITY }}
        run: |
          APP=build/macos/Build/Products/Release/termphin.app
          sign() { codesign --force --timestamp --options runtime --sign "$IDENTITY" "$@"; }
          find "$APP/Contents/Frameworks" -type f \( -name '*.dylib' -o -perm -111 \) ! -path '*/_CodeSignature/*' -print0 \
            | while IFS= read -r -d '' f; do if file "$f" | grep -q Mach-O; then sign "$f"; fi; done
          find "$APP/Contents/Frameworks" -maxdepth 1 -name '*.framework' -print0 \
            | while IFS= read -r -d '' f; do sign "$f"; done
          sign --entitlements macos/Runner/Release.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Pack the DMG
        env:
          IDENTITY: ${{ vars.MACOS_DEVID_IDENTITY }}
        run: |
          mkdir -p dmg
          cp -R build/macos/Build/Products/Release/termphin.app dmg/Termphin.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname Termphin -srcfolder dmg -ov -format UDZO Termphin.dmg
          codesign --force --timestamp --sign "$IDENTITY" Termphin.dmg

      - name: Notarize and staple
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit Termphin.dmg --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" \
            --issuer "$ISSUER" --wait --output-format json | tee notary.json
          if ! grep -q '"status" *: *"Accepted"' notary.json; then
            ID=$(python3 -c 'import json; print(json.load(open("notary.json"))["id"])')
            xcrun notarytool log "$ID" --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER"
            rm -f "$RUNNER_TEMP/notary.p8"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple Termphin.dmg
          spctl -a -t open --context context:primary-signature -v Termphin.dmg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Termphin-macos-dmg
          path: Termphin.dmg
          retention-days: 14

      - name: Publish a pre-release
        if: ${{ inputs.preview }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          TAG="desktop-$VERSION-preview.$GITHUB_RUN_NUMBER"
          gh release create "$TAG" Termphin.dmg --target "$(git rev-parse HEAD)" --prerelease --latest=false \
            --title "Termphin for Mac $VERSION preview $GITHUB_RUN_NUMBER" \
            --notes "A test build of the desktop app for macOS from \`$REF\`, signed and notarized. Not a release."

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

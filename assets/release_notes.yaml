    - "Importing a private key that is protected by a passphrase now works - the form asks for the passphrase when the key needs one"
    - "Saving a group while a menu is still open no longer closes the app"
    - "Rendering improvements"

- version: "1.6.0"
  date: "2026-09-18"
  changed:
    - "Tags have been replaced by groups, which make organising your machines, SSH keys and snippets easier"
    - "UI improvements"

- version: "1.5.0"

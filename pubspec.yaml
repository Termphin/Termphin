name: termphin
description: "Termphin SSH client."
publish_to: 'none'

version: 1.13.0+23

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.1
  dartssh2: ^4.0.0
  terminal_view: ^0.5.0
  shared_preferences: ^2.5.6
  uuid: ^4.5.1
  flutter_animate: ^4.5.2
  local_auth: ^3.0.1
  pinenacl: ^0.6.0
  pointycastle: ^4.0.0
  url_launcher: ^6.3.3
  file_picker: ^13.1.0
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  slang: ^4.14.0
  slang_flutter: ^4.14.0
  # Vendored fork: upstream 2.1.0 extends IconData, which Flutter 3.44 made final.
  # See third_party/phosphor_flutter/README.md
  phosphor_flutter:
    path: third_party/phosphor_flutter
  dropdown_button2: ^3.0.0
  quick_actions: ^1.1.0
  flutter_foreground_task: ^11.0.0
  intl: ^0.20.2
  posthog_flutter: ^5.50.7
  flutter_svg: ^2.3.0
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  flutter_secure_storage: ^11.0.0
  package_info_plus: ^10.2.2
  connectivity_plus: ^7.3.1
  yaml: ^3.1.3
  in_app_review: ^2.0.10
  webview_flutter: ^4.14.1
  flutter_local_notifications: ^22.3.1
  app_links: ^7.2.2
  clock: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.16.2
  slang_build_runner: ^4.14.0
  change_app_package_name: ^1.5.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/termphin-agent/
    - assets/logo.png
    - assets/icons/material/
    - assets/icons/profile_avatars/
    - assets/release_notes.yaml
    - assets/whats_new.yaml
    - assets/whats_new/

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: HubotSans
      fonts:
        - asset: assets/fonts/HubotSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HubotSans-Bold.ttf
          weight: 700
    - family: Epilogue
      fonts:
        - asset: assets/fonts/Epilogue-Regular.ttf
          weight: 400
        - asset: assets/fonts/Epilogue-Medium.ttf
          weight: 500
        - asset: assets/fonts/Epilogue-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Epilogue-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: HackNerdFontMono
      fonts:
        - asset: assets/fonts/HackNerdFontMono-Regular.ttf
    - family: JetBrainsMonoNerdFontMono
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFontMono-Regular.ttf
    - family: FiraCodeNerdFontMono
      fonts:
        - asset: assets/fonts/FiraCodeNerdFontMono-Regular.ttf
    - family: UbuntuMonoNerdFontMono
      fonts:
        - asset: assets/fonts/UbuntuMonoNerdFontMono-Regular.ttf
    - family: SauceCodeProNerdFontMono
      fonts:
        - asset: assets/fonts/SauceCodeProNerdFontMono-Regular.ttf
    - family: Noto Sans Symbols2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/termphin_icon.png
  adaptive_icon_foreground: assets/icons/termphin_foreground.png
  # An image, not a flat colour: the mark sits on a blue gradient, and a hex
  # background would flatten it. Both files come out of scripts/generate_icons.py.
  adaptive_icon_background: assets/icons/termphin_background.png
  # Android 13+ themed icons. A launcher will synthesise one from the
  # foreground when this is absent, which on a gradient body comes back
  # as an over-filled blob; this is the deliberate silhouette, the same
  # shape the notification icon uses, with the eye punched through.
  adaptive_icon_monochrome: assets/icons/termphin_monochrome.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

dependency_overrides:
  isolate_manager: ^6.3.2
